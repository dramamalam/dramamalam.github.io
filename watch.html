<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>StreamHub - Pemutar Media HD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #090d16;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .ambient-glow {
            background: radial-gradient(circle at 50% -20%, rgba(225, 29, 72, 0.22), transparent 70%),
                        radial-gradient(circle at 50% 120%, rgba(99, 102, 241, 0.15), transparent 70%);
        }
        .progress-bar-bg { 
            height: 4px; 
            background: rgba(255,255,255,0.15); 
            width: 100%; 
            position: absolute; 
            bottom: 0; 
            left: 0; 
        }
        .progress-fill { 
            height: 100%; 
            background: #e11d48; 
            width: 52%; 
        }
    </style>
</head>
<body class="ambient-glow min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Card Wrapper Glassmorphism -->
    <div class="w-full max-w-lg bg-slate-900/85 border border-slate-800/80 backdrop-blur-xl rounded-3xl p-6 sm:p-8 shadow-2xl shadow-black/60 flex flex-col items-center text-center transition-all">
        
        <!-- Badge Status Atas -->
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/60 text-slate-300 text-xs font-semibold mb-5">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
            </span>
            <span>Server Siaga</span>
            <span class="text-slate-600">|</span>
            <span class="text-rose-400 font-bold uppercase tracking-wider text-[11px]">1080p Full HD</span>
        </div>

        <!-- Video Player Preview Mockup -->
        <div id="playerArea" class="w-full aspect-video bg-black rounded-2xl overflow-hidden relative group cursor-pointer border border-slate-800 shadow-xl mb-6">
            
            <!-- Video Overlay Gradien Gelap -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-black/20"></div>
            
            <!-- Tombol Play Tengah -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-rose-600 text-white rounded-full flex items-center justify-center shadow-xl shadow-rose-600/50 group-hover:scale-110 group-active:scale-95 transition-all duration-300 border-4 border-white/20">
                    <i class="fas fa-play text-xl sm:text-2xl ml-1"></i>
                </div>
            </div>

            <!-- Kontrol Dummy Bawah -->
            <div class="absolute bottom-3 left-4 right-4 z-20 flex justify-between items-center text-white/90 text-xs font-medium">
                <div class="flex items-center gap-3">
                    <span class="flex items-center gap-2 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-md border border-white/10">
                        <i class="fas fa-pause text-[10px] text-rose-500"></i> 
                        <span class="tabular-nums text-[11px]">08:42 / 18:05</span>
                    </span>
                </div>
                <div class="flex items-center gap-3 text-slate-400">
                    <i class="fas fa-volume-up text-xs hover:text-white"></i>
                    <i class="fas fa-cog text-xs hover:text-white"></i>
                    <i class="fas fa-expand text-xs hover:text-white"></i>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-bg">
                <div class="progress-fill relative">
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-rose-400 rounded-full shadow-md shadow-rose-600"></div>
                </div>
            </div>
        </div>

        <!-- Judul & Keterangan (Bahasa Profesional & Bersih) -->
        <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight leading-snug mb-2">
            Tayangan Siap Dimainkan
        </h1>
        <p class="text-slate-400 text-sm leading-relaxed mb-6 px-2">
            Tekan area pemutar video di atas atau tombol aksi di bawah untuk segera memulai streaming berkecepatan tinggi.
        </p>

        <!-- Tombol Aksi Utama -->
        <button id="startBtn" class="w-full bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white font-bold py-4 px-6 rounded-2xl text-base sm:text-lg shadow-xl shadow-rose-600/30 transition-all flex items-center justify-center gap-3 group cursor-pointer mb-6 border border-rose-400/20">
            <i class="fas fa-play text-sm"></i>
            <span>Putar Tayangan Sekarang</span>
            <i class="fas fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
        </button>

        <!-- Indikator Fitur Bawah (3 Kolom Serasi) -->
        <div class="pt-5 border-t border-slate-800 w-full grid grid-cols-3 gap-2 text-slate-400 text-xs font-medium">
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-film text-slate-500 text-sm"></i>
                <span class="text-slate-300">Resolusi 1080p</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-bolt text-amber-400 text-sm"></i>
                <span class="text-slate-300">Ultra Fast</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <i class="fas fa-server text-emerald-400 text-sm"></i>
                <span class="text-slate-300">Server Aktif</span>
            </div>
        </div>

    </div>

    <!-- Script Redirect -->
    <script>
        const domains = [
            'https://ceritavid.github.io/',
            'https://hai8g.com/4/10817251'
        ];

        function triggerAction() {
            const randomUrl = domains[Math.floor(Math.random() * domains.length)];
            window.open(randomUrl, '_blank');
            window.location.href = 'https://hai8g.com/4/10817251';
        }

        // Berlaku untuk klik area player maupun tombol
        document.getElementById('playerArea').addEventListener('click', triggerAction);
        document.getElementById('startBtn').addEventListener('click', triggerAction);
    </script>

    <!-- Tracker Histats -->
    <script type='text/javascript'>
        var _Hasync=_Hasync||[];
        _Hasync.push(['Histats.start', '1,5060594,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function(){
            var hs = document.createElement('script'); hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';
            (document.head||document.body).appendChild(hs);
        })();
    </script>
</body>
</html>
